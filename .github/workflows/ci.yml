name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  libsql:
    runs-on: ubuntu-latest
    env:
      CREWLY_TEST_LIBSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --include=optional
      - run: npm test -- --maxWorkers=4
      - name: Verify the remote database path against a pinned libSQL primary
        shell: bash
        run: |
          set -euo pipefail
          LIBSQL_TEST_DIR=$(mktemp -d)
          LIBSQL_TEST_ARCHIVE=libsql-server-x86_64-unknown-linux-gnu.tar.xz
          LIBSQL_TEST_RELEASE=https://github.com/tursodatabase/libsql/releases/download/libsql-server-v0.24.32
          curl -fsSL "$LIBSQL_TEST_RELEASE/$LIBSQL_TEST_ARCHIVE" -o "$LIBSQL_TEST_DIR/$LIBSQL_TEST_ARCHIVE"
          curl -fsSL "$LIBSQL_TEST_RELEASE/$LIBSQL_TEST_ARCHIVE.sha256" -o "$LIBSQL_TEST_DIR/$LIBSQL_TEST_ARCHIVE.sha256"
          (
            cd "$LIBSQL_TEST_DIR"
            sha256sum -c "$LIBSQL_TEST_ARCHIVE.sha256"
            tar -xf "$LIBSQL_TEST_ARCHIVE"
          )
          CREWLY_TEST_LIBSQL_SERVER="$LIBSQL_TEST_DIR/libsql-server-x86_64-unknown-linux-gnu/sqld" npm test -- test/db/libsql-remote.test.ts --maxWorkers=1

  # The same suite on PostgreSQL, the database hosted servers run on. It also
  # holds the PostgreSQL baseline to SQLite's schema (src/db/postgres.test.ts).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crewly
          POSTGRES_PASSWORD: crewly
          POSTGRES_DB: crewly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crewly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CREWLY_TEST_DATABASE_URL: postgres://crewly:crewly@localhost:5432/crewly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # Keep PostgreSQL below its connection ceiling while each test receives
      # an isolated schema. This is intentionally slower and deterministic.
      - run: npm test -- --maxWorkers=4

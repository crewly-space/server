name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # Keep PostgreSQL below its connection ceiling while each test receives
      # an isolated schema. This is intentionally slower and deterministic.
      - run: npm test -- --maxWorkers=4

  # The same suite on PostgreSQL, the database hosted servers run on. It also
  # holds the PostgreSQL baseline to SQLite's schema (src/db/postgres.test.ts).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crewly
          POSTGRES_PASSWORD: crewly
          POSTGRES_DB: crewly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crewly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CREWLY_TEST_DATABASE_URL: postgres://crewly:crewly@localhost:5432/crewly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm test

services:
  opencrew:
    image: ghcr.io/opentribe-dev/opencrew:${OPENCREW_VERSION:-latest}
    container_name: opencrew
    restart: unless-stopped
    ports:
      - "${OPENCREW_BIND_ADDRESS:-127.0.0.1}:${OPENCREW_PORT:-8787}:8787"
    volumes:
      - opencrew-data:/data
    environment:
      NODE_ENV: production
      OPENCREW_HOST: 0.0.0.0
      OPENCREW_PORT: 8787
      OPENCREW_DATA_DIR: /data
      OPENCREW_WEB_DIR: /app/web
      OPENCREW_LOG_LEVEL: ${OPENCREW_LOG_LEVEL:-info}
      OPENCREW_TRUST_PROXY: ${OPENCREW_TRUST_PROXY:-true}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  opencrew-data:

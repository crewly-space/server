services:
  crewly:
    image: ghcr.io/crewly-space/server:${CREWLY_VERSION:-latest}
    container_name: crewly
    restart: unless-stopped
    ports:
      - "${CREWLY_BIND_ADDRESS:-127.0.0.1}:${CREWLY_PORT:-8787}:8787"
    volumes:
      - crewly-data:/data
    environment:
      NODE_ENV: production
      CREWLY_HOST: 0.0.0.0
      CREWLY_PORT: 8787
      CREWLY_DATA_DIR: /data
      CREWLY_WEB_DIR: /app/web
      CREWLY_LOG_LEVEL: ${CREWLY_LOG_LEVEL:-info}
      CREWLY_TRUST_PROXY: ${CREWLY_TRUST_PROXY:-true}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  crewly-data:
